; ==========================================================================
; RÉGLAGES PHP DU SITE (lus par la plupart des hébergeurs PHP-FPM / CGI)
; - CV candidats : 5 Mo max (vérifié dans api/candidat.php)
; - Médias des événements (back-office) : photos 8 Mo, vidéos 50 Mo chacune
;   (vérifié dans includes/evenements.php). post_max_size = taille TOTALE
;   d'un envoi : plusieurs fichiers envoyés d'un coup s'additionnent.
; - max_file_uploads : nombre de fichiers maximum par envoi.
; Remarque : le serveur local "php -S" (lancer.bat) ignore ce fichier ; il
; utilise le php.ini de Laragon.
; ==========================================================================
upload_max_filesize = 64M
post_max_size = 70M
max_file_uploads = 20
