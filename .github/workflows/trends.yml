name: Trends

# Daily refresh of the "Tendances" charts (Apple Music most-played fr / us / gb)
# into public/trends.json, with each new song resolved ONCE to a YouTube video
# id and remembered in data/yt-map.json. Both files are committed, then the
# site is redeployed (commits pushed with GITHUB_TOKEN do not trigger other
# workflows, so the deploy workflow is called directly).
#
# Quota: each new song costs 101 YouTube units (search.list 100 + videos.list
# 1); MAX_RESOLVE caps a run (default 60 → ~6,060 units of the 10,000/day).
#
# NOTE: GitHub only runs `schedule` triggers on the DEFAULT branch (main).
# Until feat/overhaul is merged into main, start it by hand from the Actions
# tab ("Run workflow", pick the branch).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      max_resolve:
        description: "New songs to resolve (101 YouTube quota units each)"
        required: false
        default: "60"

permissions:
  contents: write

concurrency:
  group: trends
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Build charts and resolve new songs
        run: node scripts/build-trends.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.NEXT_PUBLIC_YOUTUBE_API_KEY }}
          MAX_RESOLVE: ${{ inputs.max_resolve || '60' }}

      - name: Commit data/yt-map.json and public/trends.json
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yt-map.json public/trends.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(trends): refresh charts and YouTube video map"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-infinityfree.yml
    with:
      ref: ${{ needs.build.outputs.sha }}
    secrets: inherit
